[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:vllm]
command=/opt/vllm/bin/python -m vllm.entrypoints.openai.api_server
    --model %(ENV_VLLM_MODEL)s
    --served-model-name %(ENV_VLLM_MODEL)s
    --port %(ENV_VLLM_PORT)s
    --host 0.0.0.0
    --tensor-parallel-size 1
    --max-model-len 32768
    --trust-remote-code
    --gpu-memory-utilization 0.60
    --disable-log-requests
environment=CUDA_VISIBLE_DEVICES="0",HF_HOME="%(ENV_HF_HOME)s"
autorestart=true
startretries=3
stdout_logfile=/var/log/supervisor/vllm.log
stderr_logfile=/var/log/supervisor/vllm_err.log
priority=10

[program:api]
command=python -m uvicorn server.main:app
    --host 0.0.0.0
    --port %(ENV_GSSTUDIO_PORT)s
    --workers 1
directory=/app
environment=HOME="/root"
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
priority=20
