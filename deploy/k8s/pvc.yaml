apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gsstudio-hf-cache
  namespace: gsstudio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 250Gi
  # storageClassName: <your-storage-class>  # Uncomment and set for your cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gsstudio-workdir
  namespace: gsstudio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  # storageClassName: <your-storage-class>  # Uncomment and set for your cluster
