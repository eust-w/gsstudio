apiVersion: v1
kind: Pod
metadata:
  name: gsstudio-build-context-loader
  namespace: gsstudio
spec:
  nodeName: 192.168.80.136
  restartPolicy: Never
  containers:
    - name: loader
      image: alpine:3.21
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: build-context
          mountPath: /build-context
  volumes:
    - name: build-context
      hostPath:
        path: /home/cce/gsstudio/build-context-v69
        type: DirectoryOrCreate
