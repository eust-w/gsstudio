apiVersion: v1
kind: Service
metadata:
  name: gsstudio
  namespace: gsstudio
  labels:
    app: gsstudio
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: vllm
      port: 8100
      targetPort: 8100
      protocol: TCP
  selector:
    app: gsstudio
