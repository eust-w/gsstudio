apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsstudio
  namespace: gsstudio
  annotations:
    gsstudio.io/rollback-image: ccr-29eug8s3-pub.cnc.bj.baidubce.com/dataflow-poc/gsstudio:a800-v68
  labels:
    app: gsstudio
    variant: gpu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gsstudio
  template:
    metadata:
      labels:
        app: gsstudio
        variant: gpu
      annotations:
        gsstudio.io/release-digest: sha256:ca016371fc3ebfbd77b26d9fe468298cddc710bcd9b721af2830630ffe68f1aa
    spec:
      nodeSelector:
        kubernetes.io/hostname: "192.168.80.136"
      containers:
        - name: gsstudio
          image: ccr-29eug8s3-pub.cnc.bj.baidubce.com/dataflow-poc/gsstudio:a800-v69
          imagePullPolicy: Always
          command: ["/app/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: vllm
              containerPort: 8100
              protocol: TCP
          env:
            - name: GSSTUDIO_PORT
              value: "8000"
            - name: GSSTUDIO_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: gsstudio-basic-auth
                  key: username
            - name: GSSTUDIO_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gsstudio-basic-auth
                  key: password
            - name: GSSTUDIO_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gsstudio-service-auth
                  key: token
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gsstudio-huggingface
                  key: token
                  optional: true
            - name: GSSTUDIO_DATA_DIR
              value: "/data/tasks"
            - name: GSSTUDIO_HF_HOME
              value: "/models/hf-cache"
            - name: HF_HOME
              value: "/models/hf-cache"
            - name: TORCH_HOME
              value: "/models/torch-cache"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: GSSTUDIO_HYWORLD_REPO
              value: "/opt/hyworld2"
            - name: GSSTUDIO_PANOGEN_PYTHON
              value: "/opt/panogen/bin/python"
            - name: GSSTUDIO_NUM_GPUS
              value: "5"
            - name: GSSTUDIO_MOCK_PIPELINE
              value: "false"
            - name: GSSTUDIO_MANAGE_VLLM
              value: "true"
            - name: VLLM_PORT
              value: "8100"
            - name: VLLM_MODEL
              value: "Qwen/Qwen3-VL-8B-Instruct"
            - name: PYTHONPATH
              value: "/opt/hyworld2"
            - name: TORCH_CUDA_ARCH_LIST
              value: "8.0"
          resources:
            requests:
              cpu: "8"
              memory: 128Gi
              nvidia.com/gpu: 5
            limits:
              cpu: "32"
              memory: 512Gi
              nvidia.com/gpu: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS --max-time 3 http://127.0.0.1:8000/api/health >/dev/null && nvidia-smi -L >/dev/null
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Long-lived GPU Pods can retain a healthy HTTP process after their
            # NVIDIA device mount becomes stale. Restart the container so the
            # runtime re-injects CUDA/NVML devices and the task journal resumes.
            exec:
              command:
                - /bin/sh
                - -c
                - nvidia-smi -L >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            path: /home/cce/gsstudio/data
            type: DirectoryOrCreate
        - name: models
          hostPath:
            path: /home/cce/gsstudio/models
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      imagePullSecrets:
        - name: gsstudio-registry
