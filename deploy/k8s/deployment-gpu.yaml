apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsstudio
  namespace: gsstudio
  labels:
    app: gsstudio
    variant: gpu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gsstudio
  template:
    metadata:
      labels:
        app: gsstudio
        variant: gpu
    spec:
      nodeSelector:
        kubernetes.io/hostname: "192.168.80.136"
      containers:
        - name: gsstudio
          image: ccr-29eug8s3-pub.cnc.bj.baidubce.com/dataflow-poc/gsstudio:a800-v7
          imagePullPolicy: IfNotPresent
          command: ["/app/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: vllm
              containerPort: 8100
              protocol: TCP
          env:
            - name: GSSTUDIO_PORT
              value: "8000"
            - name: GSSTUDIO_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: gsstudio-basic-auth
                  key: username
            - name: GSSTUDIO_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gsstudio-basic-auth
                  key: password
            - name: GSSTUDIO_DATA_DIR
              value: "/data/tasks"
            - name: GSSTUDIO_HF_HOME
              value: "/models/hf-cache"
            - name: HF_HOME
              value: "/models/hf-cache"
            - name: GSSTUDIO_HYWORLD_REPO
              value: "/opt/hyworld2"
            - name: GSSTUDIO_PANOGEN_PYTHON
              value: "/opt/panogen/bin/python"
            - name: GSSTUDIO_NUM_GPUS
              value: "5"
            - name: GSSTUDIO_MOCK_PIPELINE
              value: "false"
            - name: GSSTUDIO_MANAGE_VLLM
              value: "true"
            - name: VLLM_PORT
              value: "8100"
            - name: VLLM_MODEL
              value: "Qwen/Qwen3-VL-8B-Instruct"
            - name: PYTHONPATH
              value: "/opt/hyworld2"
            - name: TORCH_CUDA_ARCH_LIST
              value: "8.0"
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: 5
            limits:
              cpu: "32"
              memory: 64Gi
              nvidia.com/gpu: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 60
        - name: caddy
          image: caddy:2.10.2-alpine
          command: ["caddy"]
          args: ["run", "--config", "/etc/caddy/caddy.json"]
          ports:
            - name: caddy-http
              containerPort: 80
              protocol: TCP
            - name: caddy-https
              containerPort: 443
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /home/cce/gsstudio/data
            type: DirectoryOrCreate
        - name: models
          hostPath:
            path: /home/cce/gsstudio/models
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: caddy-data
          hostPath:
            path: /home/cce/gsstudio/caddy
            type: DirectoryOrCreate
        - name: caddy-config
          configMap:
            name: gsstudio-caddy
      imagePullSecrets:
        - name: gsstudio-registry
